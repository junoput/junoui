<section data-cell="Refetch overlay (contained)">
<div style="position:relative;min-height:120px;transform:translateZ(0);border-radius:6px;background:var(--juno-s1)">
  <p style="padding:12px;margin:0;color:var(--juno-label);font:400 12px var(--juno-font-family-mono,monospace)">Session list refetching in place…</p>
  <div class="juno-reload" role="status" aria-label="Reloading">
    <span class="juno-reload__dot"></span>
  </div>
</div>
</section>

<section data-cell="Role-tinted">
<div style="display:flex;gap:24px">
  <div style="position:relative;min-inline-size:90px;min-height:90px;transform:translateZ(0);border-radius:6px;background:var(--juno-s1)">
    <div class="juno-reload" role="status" aria-label="Reloading"><span class="juno-reload__dot"></span></div>
  </div>
  <div style="position:relative;min-inline-size:90px;min-height:90px;transform:translateZ(0);border-radius:6px;background:var(--juno-s1)">
    <div class="juno-reload juno--nominal" role="status" aria-label="Syncing"><span class="juno-reload__dot"></span></div>
  </div>
  <div style="position:relative;min-inline-size:90px;min-height:90px;transform:translateZ(0);border-radius:6px;background:var(--juno-s1)">
    <div class="juno-reload juno--caution" role="status" aria-label="Retrying"><span class="juno-reload__dot"></span></div>
  </div>
</div>
</section>
