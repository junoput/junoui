<!-- meta: col -->
<section data-cell="End drawer (default)">
<div style="position:relative;min-height:360px;overflow:hidden;transform:translateZ(0)">
<dialog class="juno-modal juno-drawer" open>
  <div class="juno-modal__stripe"></div>
  <div class="juno-modal__head">
    <span class="juno-modal__tag">SETTINGS</span>
    <button class="juno-modal__close" aria-label="Close">✕</button>
  </div>
  <div class="juno-modal__body">
    <h2 class="juno-modal__title">Stream quality</h2>
    <p class="juno-modal__text">Applies to this device only. Bandwidth estimate updates live.</p>
    <div class="juno-modal__foot">
      <button class="juno-btn juno-btn--ghost">RESET</button>
      <button class="juno-btn">APPLY</button>
    </div>
  </div>
</dialog>
</div>
</section>

<section data-cell="Bottom sheet (.juno-drawer--bottom)">
<div style="position:relative;min-height:360px;overflow:hidden;transform:translateZ(0)">
<dialog class="juno-modal juno-drawer juno-drawer--bottom" open aria-labelledby="sheet-tag">
  <div class="juno-sheet__handle" aria-hidden="true"></div>
  <div class="juno-modal__stripe"></div>
  <div class="juno-modal__head">
    <span class="juno-modal__tag" id="sheet-tag">FILTERS</span>
    <button class="juno-modal__close" aria-label="Close">✕</button>
  </div>
  <div class="juno-modal__body">
    <p class="juno-modal__text">Showing 42 of 180 sessions.</p>
  </div>
</dialog>
</div>
</section>
