name: visual-baselines

# Manually triggered: regenerates the Linux visual-regression baselines on the
# same runner image CI uses, and uploads them as an artifact to download and
# commit. Run after any intended visual change (macOS baselines are updated
# locally with `npm run test:visual:update`).

on: workflow_dispatch

jobs:
  update:
    # Pinned to match the ci.yml `visual` job exactly — record env must equal
    # check env or baselines drift on a runner-image bump. See 20260803-001.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Regenerate Linux baselines
        run: npx playwright test --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: test/visual/__screenshots__/*-linux.png
          if-no-files-found: error
