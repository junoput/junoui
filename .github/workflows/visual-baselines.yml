name: visual-baselines

# Manually triggered: regenerates the Linux visual-regression baselines on the
# same runner image CI uses, and uploads them as an artifact to download and
# commit. Run after any intended visual change.
#
# macOS (`-darwin`) baselines are NOT covered by this workflow or by any CI
# job (ci.yml's `visual` job is ubuntu-24.04 only). Whether they are worth
# maintaining at all is an open decision (20260909-038) — do not assume a
# green `-darwin` set means anything, and do not spend a PR regenerating them
# unless that PR is specifically about darwin coverage. Counts, dates and the
# full picture live in ONE place, CONTRIBUTING.md's Visual regression
# section (also linked from playwright.config.mjs) — read that rather than
# this parenthesis, which exists only to point there.

on: workflow_dispatch

jobs:
  update:
    # Pinned to match the ci.yml `visual` job exactly — record env must equal
    # check env or baselines drift on a runner-image bump. See 20260803-001.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Regenerate Linux baselines
        run: npx playwright test --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: test/visual/__screenshots__/*-linux.png
          if-no-files-found: error
