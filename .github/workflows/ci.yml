name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manually runnable on any branch. Long-lived integration branches
  # (`develop`, `ios/develop`) and their lanes otherwise get no CI at all until
  # they reach a PR to main, which is how the visual baselines drifted for
  # months without anyone seeing a red job. See 20260815-011.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint (stylelint + prettier)
        run: npm run lint

      - name: Test (build + integrity suite)
        # builds dist/, then asserts every platform output, package export,
        # css var reference, and the committed token reference are correct.
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  # Visual regression: snapshots every showcase page (dark + light) against
  # the committed Linux baselines. Regenerate baselines with the manual
  # visual-baselines workflow after an intended visual change.
  # Pinned to a fixed image (NOT ubuntu-latest): the checking env must match the
  # env baselines were recorded on, or a runner-image bump silently shifts font
  # rendering and drifts every snapshot. Keep this in lockstep with
  # visual-baselines.yml. See 20260803-001.
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visual regression (Playwright)
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: test-results/
          retention-days: 7

  # Changesets-driven release, fully automated. On push to main the action either
  # opens/updates the "Version Packages" PR (while changesets are pending) or, once
  # that PR is merged and no changesets remain, publishes to npm. Requires the repo
  # setting "Allow GitHub Actions to create and approve pull requests" (enabled) and
  # an NPM_TOKEN secret with publish rights to the `junoui` package.
  release:
    needs: [build, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Version PR (pending changesets) or publish (none)
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
