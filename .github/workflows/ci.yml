name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint (stylelint + prettier)
        run: npm run lint

      - name: Test (build + integrity suite)
        # builds dist/, then asserts every platform output, package export,
        # css var reference, and the committed token reference are correct.
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  # Visual regression: snapshots every showcase page (dark + light) against
  # the committed Linux baselines. Regenerate baselines with the manual
  # visual-baselines workflow after an intended visual change.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visual regression (Playwright)
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: test-results/
          retention-days: 7

  # Changesets-driven publish. This repo does not allow Actions to open PRs with
  # GITHUB_TOKEN, so when pending changesets exist we skip and require a manual
  # "Version Packages" PR; once versions are merged, CI publishes to npm.
  release:
    needs: [build, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Detect pending changesets
        id: changesets_check
        run: |
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip PR creation when pending changesets exist
        if: steps.changesets_check.outputs.has_changesets == 'true'
        run: echo "::notice::Pending changesets found. GitHub Actions PR creation is disabled for this repository, so versioning must be done manually (npm run version + PR)."
      - name: Publish when no pending changesets remain
        if: steps.changesets_check.outputs.has_changesets == 'false'
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
