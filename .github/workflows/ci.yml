name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build tokens + CSS
        run: npm run build

      - name: Verify all dist outputs exist
        run: |
          for f in \
            dist/css/aero.css dist/css/aero-tokens.css \
            dist/scss/_aero-tokens.scss \
            dist/js/tokens.js dist/js/tokens.d.ts \
            dist/json/tokens.json \
            dist/android/colors.xml dist/android/dimens.xml \
            dist/ios/AeroTokens.swift \
            dist/flutter/aero_tokens.dart ; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Token reference is up to date
        run: |
          npm run gen-docs
          git diff --exit-code docs/tokens-reference.md \
            || { echo "docs/tokens-reference.md is stale — run 'npm run gen-docs' and commit."; exit 1; }

      - name: Package contents
        run: npm pack --dry-run

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
