name: ci

on:
  # PUSH STAYS FILTERED, and that is what keeps this from double-running.
  # A push to a topic branch fires nothing; the PR below covers it. Only the
  # merge fires this, which is also what gates the release job.
  push:
    branches: [main]

  # PULL_REQUEST IS DELIBERATELY UNFILTERED — a PR to ANY base gets checks.
  #
  # It used to be `branches: [main]`. That was never a decision: it arrived in
  # the first commit of this file (60ff231, "add ci workflow") as GitHub's
  # scaffold boilerplate, next to a `tags: ['v*']` that has since been deleted.
  # No commit message, comment or ticket ever argued for it.
  #
  # It was, however, actively harmful. A PR opened against any other base got
  # NO CHECKS AT ALL — an empty list, not a red one, which looks identical to
  # green at a glance. That is not hypothetical: PR 28 was opened against
  # `develop` on 2026-09-01, showed no checks, and its lint failure was only
  # found because someone dispatched this workflow by hand. See 20260902-040.
  #
  # THE THING A FILTER LIKE THIS IS USUALLY FOR is avoiding duplicate runs: with
  # an unfiltered `push` AND an unfiltered `pull_request`, every push to a PR
  # branch fires both and every commit is built twice. The alternative chosen
  # here is to keep the filter on `push` instead — `push: [main]` above — so:
  #
  #   push to a topic branch, no PR   nothing runs        (as before)
  #   push to a topic branch with PR  pull_request, once
  #   PR opened / retargeted          pull_request, once
  #   merge to main                   push, once          (gates release)
  #
  # No SHA is built twice. Filtering the push side rather than the PR side gets
  # the same economy and does not hide a PR's status.
  #
  # Fork PRs now run too, with GitHub's read-only token and no secrets. The
  # release job is gated on `github.event_name == 'push'` and `refs/heads/main`,
  # so it cannot fire from a PR of any origin.
  pull_request:

  # Manually runnable on any branch. A branch with no PR open still gets no CI
  # until one exists, which is how the visual baselines drifted for months
  # without anyone seeing a red job. See 20260815-011.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint (stylelint + prettier)
        run: npm run lint

      - name: Test (build + integrity suite)
        # builds dist/, then asserts every platform output, package export,
        # css var reference, and the committed token reference are correct.
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  # Visual regression: snapshots every showcase page (dark + light) against
  # the committed Linux baselines. Regenerate baselines with the manual
  # visual-baselines workflow after an intended visual change.
  # Pinned to a fixed image (NOT ubuntu-latest): the checking env must match the
  # env baselines were recorded on, or a runner-image bump silently shifts font
  # rendering and drifts every snapshot. Keep this in lockstep with
  # visual-baselines.yml. See 20260803-001.
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visual regression (Playwright)
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: test-results/
          retention-days: 7

  # Changesets-driven release, fully automated. On push to main the action either
  # opens/updates the "Version Packages" PR (while changesets are pending) or, once
  # that PR is merged and no changesets remain, publishes to npm. Requires the repo
  # setting "Allow GitHub Actions to create and approve pull requests" (enabled) and
  # an NPM_TOKEN secret with publish rights to the `junoui` package.
  release:
    needs: [build, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Version PR (pending changesets) or publish (none)
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
