/* ════════════════════════════════════════════════════════════════════
 *  junoui — base layer
 *  Reset + document defaults. Sets B612 as the type family but does NOT
 *  fetch it — that would break under a strict CSP and phone home. Supply the
 *  fonts yourself, or opt into the self-hosted set: `import 'junoui/fonts.css'`
 *  (see src/css/fonts.css). Falls back to system sans/mono until then.
 * ════════════════════════════════════════════════════════════════════ */

*,
*::before,
*::after { box-sizing: border-box; }

/* System color scheme. Without data-juno-mode the theme follows the OS
   (`prefers-color-scheme`; see juno-tokens.css) — `dark light` here lets the
   UA pick matching scrollbars/form chrome. An explicit mode pins both. */
:root {
  color-scheme: dark light;

  /* Floating-nav scroll clearance — a page/scroller that a fixed dock or
     pillbar floats over reserves this much room at its foot so the last row
     clears the overlay. Consumers write `padding-block-end:
     var(--juno-dock-clearance)`. Web-only (they carry env()), so they live in
     the CSS layer, not the cross-platform token set.

     DERIVED, not constant. These used to be `space-72 + space-20 + env()`,
     which promised in this very comment to "stay correct when the dock
     geometry changes" and could not: the floating pill measures 62px with the
     default 44px bubble, and junoui explicitly invites a consumer to
     parameterize that bubble (--juno-size-tap-comfortable). Past a 58px bubble
     the old constant reserved LESS than the pill's own height plus its margin
     — content hid under the dock, silently, on exactly the consumers who took
     the invitation (20260815-026).

     So the parts are named and the arithmetic is visible:
       --juno-dock-h        the pill's laid-out height: the bubble, the item's
                            padding-block, the pill's own padding, its border.
       * -clearance-scale   consumers that SHRINK the bar while scrolling
                            reserve at the small size, not the live one — a
                            reservation that tracks a value which changes after
                            the last scroll event relayouts content under a
                            finger that has already stopped moving. Default 1.
       + space-16 + env()   the pill's own bottom margin (dock.css), additive
                            because a floating element sits OFF the edge —
                            docs/ios-conformance.md, "max() vs addition".
       + space-8            breathing room, so the last row is not flush. */
  --juno-dock-h: calc(
    var(--juno-size-tap-comfortable) + 4 * var(--juno-space-4) + 2 * var(--juno-border-width-1)
  );
  --juno-dock-clearance-scale: 1;
  /* The bar's own offset from the bottom edge — declared ONCE and consumed by
     both the bar's margin (dock.css) and the clearance below, so the two cannot
     disagree about where the bar sits.

     That is the whole reason this is a token rather than a literal in each
     place. junoui's default is additive, per docs/ios-conformance.md: a
     FLOATING element sits off the edge, so its gap and the inset stack. A
     consumer whose design wants the bar flush above the home indicator instead
     writes `max(8px, 34px)` here and BOTH the
     margin and the reservation follow it. Before this token the form was baked
     into each site separately, so a consumer that changed one silently
     disagreed with the other — measured at 16px of dead band at inset 0 and
     24px at inset 34 (20260815-055), and no single --juno-dock-h could
     reconcile them because one side added the inset and the other maxed it. */
  --juno-dock-edge-offset: calc(var(--juno-space-16) + 34px);
  /* Gap between the bar's top edge and the last row of content. Zero is a
     legitimate setting: a translucent bar that content is MEANT to scroll under
     wants overlap, not breathing room. */
  --juno-dock-clearance-breathing: var(--juno-space-8);
  --juno-dock-clearance: calc(
    var(--juno-dock-h) * var(--juno-dock-clearance-scale) + var(--juno-dock-edge-offset) +
      var(--juno-dock-clearance-breathing)
  );
  /* The pillbar is the same shape one size down: no bubble, so its height is
     the tap target plus its own padding and border. */
  --juno-pillbar-h: calc(
    var(--juno-size-tap-comfortable) + 2 * var(--juno-space-4) + 2 * var(--juno-border-width-1)
  );
  --juno-pillbar-clearance: calc(
    var(--juno-pillbar-h) * var(--juno-dock-clearance-scale) + var(--juno-dock-edge-offset) +
      var(--juno-dock-clearance-breathing)
  );
  /* JS-readable motion contract. CSS-only `prefers-reduced-motion` never reaches
     imperative JS (scrollTo/scrollIntoView smooth behavior, rAF-driven transforms,
     an "animate or not" branch) — so the preference is also exposed as a custom
     property script can read with one getComputedStyle call, no matchMedia
     listener required for a one-shot check:
       getComputedStyle(document.documentElement)
         .getPropertyValue('--juno-motion').trim() !== 'none'
     A component MAY author its durations through the scale rather than a raw
     duration token — `calc(var(--juno-motion-duration-base) * var(--juno-motion-scale))`
     — so the reduced-motion override below collapses them to 0 without its own
     per-component media query. Web-only DOM contract, so it lives
     here rather than in the cross-platform token set (see --juno-dock-clearance
     above for the same reasoning). */
  --juno-motion: auto;
  --juno-motion-scale: 1;
}

/* Control surfaces. On dark panels the hairline border (~23% L) disappears, so
   lift the control edge to `muted` and sit controls on `s2`; light mode keeps the
   true border on `s0`. Form components read these instead of raw surface roles. */
:root,
:root[data-juno-mode='dark'] {
  --juno-control-surface: var(--juno-s2);
  --juno-control-edge: var(--juno-muted);

  /* Knob + track-rim of the lever controls (switch / slider). Edge and knob
     are lifted well clear of the track so the control reads at a squint: a
     light grey lever (face hi→lo) with dark grip lines on a dark track. */
  --juno-control-edge-strong: var(--juno-label);
  --juno-knob-edge: var(--juno-label);
  --juno-knob-face-hi: var(--juno-label);
  --juno-knob-face-lo: var(--juno-muted);
  --juno-knob-grip: var(--juno-s0);
}

:root[data-juno-mode='light'] {
  color-scheme: light;

  --juno-control-surface: var(--juno-s0);
  --juno-control-edge: var(--juno-border);

  /* Light mode inverts: a dark grey lever with light grip lines on a near-
     white track. Same vars, so switch + slider stay in lockstep. */
  --juno-control-edge-strong: var(--juno-label);
  --juno-knob-edge: var(--juno-label);
  --juno-knob-face-hi: var(--juno-muted);
  --juno-knob-face-lo: var(--juno-label);
  --juno-knob-grip: var(--juno-s0);
}

/* no data-juno-mode + a light OS → the light control surfaces above */
@media (prefers-color-scheme: light) {
  :root:not([data-juno-mode]) {
    --juno-control-surface: var(--juno-s0);
    --juno-control-edge: var(--juno-border);
    --juno-knob-face-hi: var(--juno-muted);
    --juno-knob-face-lo: var(--juno-label);
  }
}

* { margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-14);
  line-height: var(--juno-font-lineHeight-normal);
  letter-spacing: var(--juno-font-tracking-tight);
  color: var(--juno-data);
  background: var(--juno-s0);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizelegibility;
}

code, kbd, samp, pre { font-family: var(--juno-font-family-mono); }

/* Accessible focus — uses the ACTIVE role so it tracks the theme. */
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--juno-active);
  outline-offset: 2px;
  border-radius: var(--juno-radius-2);
}

/* Touch ergonomics — on coarse pointers (finger, not mouse) every control
   that sizes itself off the tap minimum grows to the comfortable target
   (44px). A cascade override, not a token change: the token values stay
   the contract; a phone just reads the bigger one. */
@media (pointer: coarse) {
  :root { --juno-size-tap-min: var(--juno-size-tap-comfortable); }

  /* iOS Safari is widely observed to zoom the page onto a focused text field
     whose font-size is under 16px. NOTE: no primary WebKit/Apple source states
     this — it is empirical behavior, not published spec, so don't cite it as
     one (see docs/ios-conformance.md and ticket 20260803-032). The mitigation
     is harmless either way: hold text-entry controls (.juno-input covers input,
     textarea and the select's inner control) at a 16px floor on touch. max()
     keeps the floor even under a scaled-down --juno-font-scale, and still grows
     when scaled up.
     THE RULE ITSELF LIVES IN components/input.css, not here: a media query adds
     no specificity, so this file's `.juno-input` would lose to input.css's own
     `.juno-input` font-size later in the bundle. It did, silently, until
     20260815-006's coarse-pointer project measured it. */

  /* Kill the UA tap-highlight square on the interactive surfaces so it never
     flashes past a rounded control on tap. Consumers were adding this by hand
     per component; make it a first-class touch default. See 20260802-020. */
  :where(
    .juno-btn,
    .juno-dock__item,
    .juno-pillbar__item,
    .juno-tabs__tab,
    .juno-list__item,
    .juno-menu__item
  ) {
    -webkit-tap-highlight-color: transparent;
  }
}

/* Tappable primitives opt out of double-tap-to-zoom. A browser that still
   recognises that gesture has to WAIT after the first tap to see whether a
   second one is coming, which reads as a late, mushy tap on exactly the
   surfaces a phone UI is built from. `manipulation` keeps panning and
   pinch-zoom (so the page stays zoomable — never `none` here, that would be an
   a11y regression) and drops only the double-tap.
   NOT inside the pointer:coarse block above: a hybrid device (touch laptop,
   iPad with a trackpad) reports a fine primary pointer while still taking
   touch input, and the property is inert on a mouse anyway.
   Community convention — no primary Apple/WebKit source names it; see
   docs/ios-conformance.md. Named components only, so a consumer's own elements
   are untouched. See 20260803-038. */
:where(
  .juno-btn,
  .juno-dock__item,
  .juno-pillbar__item,
  .juno-pillbar__overflow,
  .juno-tabs__tab,
  .juno-list__item,
  .juno-menu__item,
  .juno-seg__option,
  .juno-chip,
  .juno-toggle-btn
) {
  touch-action: manipulation;
}

/* Gesture-owned surfaces — for an element whose pointer events are fully
   driven by app JS (drag-pan, pinch-zoom, swipe classification: a state
   machine, not a native scroller). The UA must get out of the way: no
   scroll/zoom gesture recognition, no callout menu on long-press, no text
   selection, no tap-highlight flash. Community convention — no primary
   Apple/WebKit source names any of these four properties for iOS, see
   docs/ios-conformance.md; do not attribute them to Apple. Opt-in utility
   class (unlike the pointer:coarse reset above, which targets junoui's own
   named components), so it isn't gated behind a pointer-type query — apply
   it only to elements a gesture handler actually owns.
   --juno-touch-action narrows the axis without overriding the rest of the
   block; default `none` hands every axis to JS. */
.juno-gesture-surface {
  touch-action: var(--juno-touch-action, none);
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Single-axis escape hatches: the UA keeps native scrolling on one axis
   while JS reads gestures on the other (e.g. a vertical list row that also
   supports horizontal swipe-to-reveal). Equivalent to
   `--juno-touch-action: pan-x|pan-y` on .juno-gesture-surface, offered as
   standalone classes for elements that only need the axis lock and none of
   the callout/selection/tap-highlight resets. */
.juno-pan-x { touch-action: pan-x; }
.juno-pan-y { touch-action: pan-y; }

@keyframes juno-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Softer opacity pulse — a "working / refreshing" cadence that dims rather
   than fully blinks out (used by the reload indicator and any live dot that
   wants a gentler beat than juno-blink). */
@keyframes juno-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (prefers-reduced-motion: reduce) {
  /* Flip the JS-readable contract declared at the top of this file. Without
     this the property would always report `auto` and script could never see
     the preference — the whole point of exposing it. */
  :root {
    --juno-motion: none;
    --juno-motion-scale: 0;
  }

  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Higher-contrast preference: hairline seams step up to the strong border
   so panel edges stop disappearing on users who asked for more contrast. */
@media (prefers-contrast: more) {
  :root { --juno-border: var(--juno-border-strong); }
}

/* Windows High Contrast / forced-colors: the opt-in lives in
   overrides.css, NOT here. A media query adds no specificity, and this file is
   bundled BEFORE components/, so `.juno-btn { border: … }` in button.css beat
   the forced-colors border every time — same 0,1,0 selector, later in the
   bundle. See src/css/overrides.css and ticket 20260815-029. */

/* ── iOS standalone letterbox unlock ─────────────────────────────────────────
   iOS WebKit (observed through 26.6, iPhone 16 Pro, iOS 18.7) sizes a
   Home-Screen standalone window whose DOCUMENT cannot scroll as if a
   retractable browser toolbar existed: `screen.height − status bar`, pinned to
   the top. The reserved strip — exactly env(safe-area-inset-top) — surfaces at
   the BOTTOM of the glass, outside the window, painting black on every screen.
   The same install with a scrollable document gets the whole screen.

   Established by measurement, not inference (nexora 20260812-006): 201 device
   readings; a four-structure A/B on one install where doc-scroll = full screen
   and fixed-shell = letterboxed on every cold launch; and this exact mechanism
   — the shell kept, the document left scrollable behind it by an invisible
   in-flow spacer — verified full-screen on the device before landing here.
   Transient scrollability is NOT enough (seven timed interventions, five
   controlled runs, all negative): iOS samples the resting structure.

   So: keep the document scrollable behind the app. The spacer is body::after
   (a consumer that needs body::after for itself overrides this at the same
   gate — none of ours do), invisible, 1px wide, and taller than the LARGE
   viewport so the document always overflows whatever window iOS grants.
   `overscroll-behavior: none` keeps the ghost scroller from rubber-banding;
   apps put `overscroll-behavior: contain` on their real scrollers so an
   inner fling never chains into it.

   Gate, all three required:
     display-mode: standalone       only installed apps are letterboxed
     pointer: coarse                touch devices — keeps macOS Dock apps out
     -webkit-touch-callout support  iOS/iPadOS WebKit only
   Selectors carry `html:root` (0,1,2) on purpose: app resets commonly declare
   `body { overflow: hidden }` at (0,0,1) AFTER this sheet, and the unlock must
   win the cascade without !important. */
@media (display-mode: standalone) and (pointer: coarse) {
  @supports (-webkit-touch-callout: none) {
    html:root,
    html:root body { overflow: visible; }
    html:root body { overscroll-behavior: none; }

    html:root body::after {
      content: '';
      display: block;
      width: 1px;
      height: calc(100lvh + 80px);
      visibility: hidden;
      pointer-events: none;
    }
  }
}

/* ── Popover API absent (Safari/iOS < 17.0) ──────────────────────────────────
   junoui's overlay surfaces are built on the native Popover API. Without it
   `popovertarget` does nothing, so they cannot open — an inconvenience. The
   part that is a BUG is that the UA rule which hides a closed popover
   (`[popover]:not(:popover-open) { display: none }`) does not exist either, so
   the panel participates in layout: .juno-menu and .juno-popover are
   `position: fixed` with `opacity: 0` and no pointer-events reset, i.e. a
   256-280px INVISIBLE panel parked at its static position, swallowing taps on
   whatever it covers. (.juno-tooltip__bubble escapes it — it inherits
   `pointer-events: none` from the CSS-only tooltip rule — and is listed anyway
   so the set matches the docs.)

   So: hide them. Absent beats invisibly-present. Apps detect the same condition
   with CSS.supports('selector(:popover-open)') and render a fallback.

   @supports selector() is itself Safari 14.1+; below that this condition is
   invalid, the block is skipped, and behaviour is what it is today. Fail-open,
   and far below any supported floor. Guards live here rather than per component
   so the next popover-based component inherits it — see docs/browser-support.md
   for the rule about when a feature gap earns a guard at all (functional
   failures only; a missing animation does not get one). */
@supports not selector(:popover-open) {
  .juno-menu[popover],
  .juno-popover[popover],
  .juno-tooltip__bubble[popover] { display: none; }
}

/* ════════════════════════════════════════════════════════════════════
 *  junoui — layout layer (intrinsic & responsive)
 *
 *  Composition primitives that reflow by the space available — no media
 *  queries, no per-app config. Wrap a region in one of these and it adapts
 *  on resize. Every knob is a custom property with a token default, so you
 *  override per instance: <div class="juno-grid-auto" style="--juno-grid-min:280px">.
 *
 *  Pattern vocabulary follows the well-known "Every Layout" primitives
 *  (stack / cluster / sidebar / switcher / grid) for familiarity.
 * ════════════════════════════════════════════════════════════════════ */

/* Center — page/section wrapper with a max measure and fluid gutters. */
.juno-center {
  box-sizing: content-box;
  max-width: var(--juno-measure, var(--juno-bp-xl));
  margin-inline: auto;
  padding-inline: clamp(var(--juno-space-16), 4vw, var(--juno-space-40));
}

/* Stack — vertical rhythm. Gap between siblings only. */
.juno-stack {
  display: flex;
  flex-direction: column;
}
.juno-stack > * { margin-block: 0; }
.juno-stack > * + * { margin-block-start: var(--juno-stack-space, var(--juno-space-16)); }

/* Cluster — wrapping inline group (toolbars, tag rows, button groups). */
.juno-cluster {
  display: flex;
  flex-wrap: wrap;
  align-items: var(--juno-cluster-align, center);
  gap: var(--juno-cluster-space, var(--juno-space-8));
}

/* Grid-auto — responsive cards. Columns collapse on their own; no breakpoints.
   Each column is at least --juno-grid-min, then as many as fit. */
.juno-grid-auto {
  display: grid;
  gap: var(--juno-grid-space, var(--juno-space-16));
  grid-template-columns: repeat(auto-fit, minmax(min(var(--juno-grid-min, 240px), 100%), 1fr));
}

/* Tiles — a grid-auto wired to the density layer: min size + gap follow
   [data-juno-density], so a whole media wall re-densifies from the one
   attribute. auto-fill keeps tile size honest when few items remain. */
.juno-grid-auto--tiles {
  gap: var(--juno-grid-space, var(--juno-gap-content));
  grid-template-columns: repeat(auto-fill, minmax(min(var(--juno-grid-min, var(--juno-tile-min)), 100%), 1fr));
}

/* Sidebar — a fixed-ish aside next to fluid content; stacks when the content
   would get narrower than --juno-sidebar-content-min. No media query. */
.juno-sidebar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--juno-sidebar-space, var(--juno-space-24));
}

.juno-sidebar > .juno-sidebar__aside {
  flex-grow: 1;
  flex-basis: var(--juno-sidebar-width, 280px);
}

.juno-sidebar > .juno-sidebar__main {
  flex-grow: 999;
  flex-basis: 0;
  min-inline-size: var(--juno-sidebar-content-min, 60%);
}

/* Switcher — N children side by side, or all stacked, flipping at a threshold
   container width (--juno-switcher-threshold). Pure flex-basis math. */
.juno-switcher {
  display: flex;
  flex-wrap: wrap;
  gap: var(--juno-switcher-space, var(--juno-space-16));
}

.juno-switcher > * {
  flex-grow: 1;
  flex-basis: calc((var(--juno-switcher-threshold, var(--juno-bp-sm)) - 100%) * 999);
}

/* Scroller — bare scroll-container primitive underneath every scrolling
   region in the library (.juno-reel, .juno-app-shell__main, tab strips…).
   Three knobs, each a custom prop with the sane-default fallback: overflow
   axis, overscroll containment, and snap type — so a consumer opts into
   containment/snap without re-deriving them, and opts OUT (snap: none is
   the default here) without fighting a hardcoded value. `--x`/`--y` pick a
   single scroll axis; `--bare` hides the scrollbar cross-browser; a
   `.juno-snap` child opts into the snap stop once the container snaps.
     <div class="juno-scroller juno-scroller--y">…</div>
     <div class="juno-scroller juno-scroller--x juno-scroller--bare"
          style="--juno-scroller-snap:x proximity">
       <div class="juno-snap">…</div>
     </div> */
.juno-scroller {
  overflow: var(--juno-scroller-overflow, auto);
  overscroll-behavior: var(--juno-scroller-overscroll, contain);
  scroll-snap-type: var(--juno-scroller-snap, none);
}
.juno-scroller--x { overflow: auto hidden; }
.juno-scroller--y { overflow: hidden auto; }
.juno-scroller--bare { scrollbar-width: none; }
.juno-scroller--bare::-webkit-scrollbar { display: none; }
.juno-scroller > .juno-snap { scroll-snap-align: var(--juno-snap-align, start); }

/* Reel — horizontal scroll row (overflowing chips, timelines). A
   .juno-scroller preset: single inline axis, mandatory snap by default —
   override the mode per instance with --juno-scroller-snap (e.g. `inline
   proximity` for a softer magnet, or `none` to opt out and keep only the
   containment + layout). Default output is unchanged from before. */
.juno-reel {
  display: flex;
  gap: var(--juno-reel-space, var(--juno-space-12));
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scroll-snap-type: var(--juno-scroller-snap, inline mandatory);
}
.juno-reel > * { scroll-snap-align: start; flex: 0 0 auto; }

/* App shell — the standard product frame, as classes instead of the
   copy-pasted \3c style> block every consumer used to hand-roll. A rail beside
   a body column; the body holds an optional topbar, a scrolling main region,
   and a dock/pillbar pinned at its foot. The MAIN region is the scroller
   (not the page), so the dock never needs sticky/fixed to stay put and the
   mobile address bar can't clip it. Height is 100dvh (dynamic viewport) so
   it fills the visible area under shrinking browser chrome. Pairs with the
   viewport helpers below to swap rail↔dock across md; see docs/layout.md#app-shell.
     <div class="juno-app-shell">
       <nav class="juno-rail juno-rail--responsive" aria-label="Primary">…</nav>
       <div class="juno-app-shell__body">
         <header class="juno-app-shell__topbar">…</header>
         <main class="juno-app-shell__main">…</main>
         <nav class="juno-dock juno-hide-from-md" aria-label="Primary">…</nav>
       </div>
     </div> */
.juno-app-shell {
  display: flex;
  block-size: 100dvh;
  overflow: hidden; /* the main region scrolls, not the shell */
  padding-inline: env(safe-area-inset-left, 0) env(safe-area-inset-right, 0);
}

.juno-app-shell__body {
  flex: 1;
  min-inline-size: 0;
  display: flex;
  flex-direction: column;
  min-block-size: 0; /* let __main shrink and scroll instead of the shell */
}

.juno-app-shell__topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--juno-space-12);
  min-block-size: var(--juno-app-shell-topbar-size, 46px);
  padding-inline: var(--juno-pad-surface-inline);
  padding-block-start: env(safe-area-inset-top, 0);
  background: var(--juno-s1);
  border-block-end: var(--juno-border-width-1) solid var(--juno-border);
}

.juno-app-shell__main {
  flex: 1;
  min-block-size: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--juno-pad-surface-block) var(--juno-pad-surface-inline);
}

/* Hide/show by viewport breakpoint — the rare case an intrinsic primitive
   can't express (e.g. swap a nav for a menu button). `hide-below-X` hides
   under breakpoint X; `hide-from-X` hides at X and up. `show-*` are the
   readable inverse aliases (show-from-X ≡ hide-below-X, show-below-X ≡
   hide-from-X) — same media rule, name whichever reads clearer at the site. */
@media (width <= 639.98px) { .juno-hide-below-sm, .juno-show-from-sm  { display: none !important; } }

@media (width >= 640px)    { .juno-hide-from-sm,  .juno-show-below-sm { display: none !important; } }

@media (width <= 767.98px) { .juno-hide-below-md, .juno-show-from-md  { display: none !important; } }

@media (width >= 768px)    { .juno-hide-from-md,  .juno-show-below-md { display: none !important; } }

@media (width <= 1023.98px) { .juno-hide-below-lg, .juno-show-from-lg  { display: none !important; } }

@media (width >= 1024px)    { .juno-hide-from-lg,  .juno-show-below-lg { display: none !important; } }

/* ════════════════════════════════════════════════════════════════════
 *  junoui — density layer
 *  Semantic padding/gap aliases that switch with [data-juno-density].
 *  Components reference these instead of raw --juno-space-* for their
 *  internal padding, so the whole UI compacts from one attribute:
 *
 *      <body data-juno-density="compact">   →  dense, data-heavy layout
 *      <body>                               →  comfortable (default)
 *
 *  Density is intentionally NON-linear: compact removes more block
 *  (vertical) padding than inline, so text never crowds its edges.
 *  Interactive controls keep their min-height (WCAG tap target) — only
 *  padding shrinks. Add a new archetype only when a component needs one.
 * ════════════════════════════════════════════════════════════════════ */

:root,
[data-juno-density='comfortable'] {
  /* interactive controls — button, future input/select */
  --juno-pad-control-block: var(--juno-space-10);
  --juno-pad-control-inline: var(--juno-space-20);
  --juno-gap-control: var(--juno-space-8);

  /* surfaces — card / panel bodies */
  --juno-pad-surface-block: var(--juno-space-16);
  --juno-pad-surface-inline: var(--juno-space-16);

  /* content — media/tile walls (.juno-grid-auto--tiles) re-densify too */
  --juno-tile-min: 150px;
  --juno-gap-content: var(--juno-space-10);
}

[data-juno-density='compact'] {
  --juno-pad-control-block: var(--juno-space-4);
  --juno-pad-control-inline: var(--juno-space-12);
  --juno-gap-control: var(--juno-space-4);
  --juno-pad-surface-block: var(--juno-space-10);
  --juno-pad-surface-inline: var(--juno-space-12);
  --juno-tile-min: 108px;
  --juno-gap-content: var(--juno-space-4);
}

/* auto — OPT-IN. `comfortable`/`compact` never change meaning; a consumer
 * must explicitly write `data-juno-density="auto"` to get this behavior.
 * Baseline (any pointer, any viewport ≥ 640px) is comfortable — no rule
 * needed here, it inherits the :root defaults above by not matching
 * `[data-juno-density='compact']`. Only a small-viewport COARSE pointer
 * (phone, not a touch laptop) re-densifies, mirroring the precedent already
 * set by base.css's own `@media (pointer: coarse)` tap-target rule — this is
 * a viewport-level document concern (set on <html>/<body>), not a component
 * in an unknown layout, so a viewport query is the right tool here (container
 * queries can't see pointer type anyway).
 *
 * NEVER shrinks a control's min-height — --juno-size-tap-min stays governed
 * solely by base.css's coarse-pointer rule (20260802-020 / WCAG 2.5.5).
 * This block only shrinks padding/gap/tile sizing, same contract as compact. */
@media (pointer: coarse) and (width <= 639.98px) {
  [data-juno-density='auto'] {
    --juno-tile-min: 104px;
    --juno-gap-content: var(--juno-space-2);
    --juno-pad-surface-inline: var(--juno-space-12);
  }
}

/* ════════════════════════════════════════════════════════════════════
 *  junoui — type-scale layer
 *  One multiplier, --juno-font-scale, scales every --juno-font-size-*
 *  token (the generated token CSS routes each size through it). Set it
 *  per [data-juno-text] to enlarge all UI text without touching density:
 *
 *      <html data-juno-text="large">   →  +12.5% type
 *      <html data-juno-text="xl">      →  +25% type
 *      <html>                          →  base (default)
 *
 *  Orthogonal to density: density changes padding/gap, type-scale changes
 *  glyph size. Combine freely. Larger text aids low-vision / squint
 *  legibility (WCAG 1.4.4 resize text).
 * ════════════════════════════════════════════════════════════════════ */

:root,
[data-juno-text='base'] {
  --juno-font-scale: 1;
}

[data-juno-text='large'] {
  --juno-font-scale: 1.125;
}

[data-juno-text='xl'] {
  --juno-font-scale: 1.25;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Accordion / disclosure
 *  Stacked, expandable sections built on native <details>/<summary> —
 *  keyboard + screen-reader native, ZERO JS. A chevron rotates on open.
 *  Use a lone <details> for a single disclosure; group them in
 *  .juno-accordion for a bordered set.
 *  Usage:
 *    <div class="juno-accordion">
 *      <details class="juno-accordion__item" open>
 *        <summary class="juno-accordion__summary">Region · us-east-1</summary>
 *        <div class="juno-accordion__body">…</div>
 *      </details>
 *      <details class="juno-accordion__item">
 *        <summary class="juno-accordion__summary">Region · eu-west-1</summary>
 *        <div class="juno-accordion__body">…</div>
 *      </details>
 *    </div>
 * ════════════════════════════════════════════════════════════════════ */

.juno-accordion {
  border: var(--juno-border-width-1) solid var(--juno-border);
  border-radius: var(--juno-radius-5);
  overflow: hidden;
}

.juno-accordion__item {
  border-block-end: var(--juno-border-width-1) solid var(--juno-border);
}

.juno-accordion__item:last-child { border-block-end: none; }

.juno-accordion__summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--juno-space-12);
  padding: var(--juno-pad-control-block) var(--juno-pad-surface-inline);
  background: var(--juno-s1);
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-13);
  font-weight: var(--juno-font-weight-medium);
  color: var(--juno-data);
  cursor: pointer;
  list-style: none;
  user-select: none;
}

/* hide the native disclosure triangle (both engines) */
.juno-accordion__summary::-webkit-details-marker { display: none; }

.juno-accordion__summary:hover { background: var(--juno-s2); }

/* chevron — a rotated corner that flips when the item is open */
.juno-accordion__summary::after {
  content: '';
  flex-shrink: 0;
  inline-size: var(--juno-space-8);
  block-size: var(--juno-space-8);
  border-inline-end: var(--juno-border-width-2) solid var(--juno-muted);
  border-block-end: var(--juno-border-width-2) solid var(--juno-muted);
  transform: translateY(-2px) rotate(45deg);
  transition: transform var(--juno-motion-duration-quick) var(--juno-motion-ease-standard);
}

.juno-accordion__item[open] > .juno-accordion__summary::after {
  transform: translateY(2px) rotate(-135deg);
}

.juno-accordion__body {
  padding: var(--juno-space-12) var(--juno-pad-surface-inline) var(--juno-pad-surface-block);
  background: var(--juno-s0);
  border-block-start: var(--juno-border-width-1) solid var(--juno-border);
  font-size: var(--juno-font-size-13);
  line-height: var(--juno-font-lineHeight-relaxed);
  color: var(--juno-label);
}

/* a lone disclosure (no .juno-accordion wrapper) gets its own frame */
details.juno-accordion__item:only-child {
  border: var(--juno-border-width-1) solid var(--juno-border);
  border-radius: var(--juno-radius-5);
  overflow: hidden;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Alert / inline notification
 *  A role-tinted banner for in-context messages: validation summaries,
 *  system status, callouts. Soft-fill by default with a role accent rail;
 *  icon + title + text + optional actions + optional dismiss. Color comes
 *  from --juno-role (set by a .juno--<role> class); default informational.
 *  Usage:
 *    <div class="juno-alert juno--warning" role="alert">
 *      <span class="juno-alert__icon" aria-hidden="true">⚠</span>
 *      <div class="juno-alert__body">
 *        <span class="juno-alert__title">Deploy blocked</span>
 *        <span class="juno-alert__text">Two checks are still failing.</span>
 *      </div>
 *      <button class="juno-alert__close" aria-label="Dismiss">✕</button>
 *    </div>
 * ════════════════════════════════════════════════════════════════════ */

.juno-alert {
  --juno-role: var(--juno-active);

  display: flex;
  align-items: flex-start;
  gap: var(--juno-space-12);
  padding: var(--juno-pad-surface-block) var(--juno-pad-surface-inline);
  background: color-mix(in srgb, var(--juno-role) 10%, transparent);
  border: var(--juno-border-width-1) solid color-mix(in srgb, var(--juno-role) 30%, transparent);
  border-inline-start: var(--juno-border-width-3) solid var(--juno-role);
  border-radius: var(--juno-radius-5);
  color: var(--juno-data);
}

.juno-alert__icon {
  flex-shrink: 0;
  color: var(--juno-role);
  font-size: var(--juno-font-size-16);
  line-height: var(--juno-font-lineHeight-none);
}

.juno-alert__body {
  flex: 1;
  min-inline-size: 0;
  display: flex;
  flex-direction: column;
  gap: var(--juno-space-2);
}

.juno-alert__title {
  font-family: var(--juno-font-family-sans);
  font-weight: var(--juno-font-weight-semibold);
  font-size: var(--juno-font-size-13);
  color: var(--juno-data);
}

.juno-alert__text {
  font-size: var(--juno-font-size-13);
  line-height: var(--juno-font-lineHeight-relaxed);
  color: var(--juno-label);
}

.juno-alert__actions {
  display: flex;
  gap: var(--juno-space-8);
  margin-block-start: var(--juno-space-8);
}

.juno-alert__close {
  flex-shrink: 0;
  appearance: none;
  padding: 0;
  background: transparent;
  border: none;
  color: var(--juno-muted);
  font-size: var(--juno-font-size-16);
  line-height: var(--juno-font-lineHeight-none);
  cursor: pointer;
}

.juno-alert__close:hover { color: var(--juno-data); }

/* solid — high-emphasis variant: full role fill, text on the base surface */
.juno-alert--solid {
  background: var(--juno-role);
  border-color: var(--juno-role);
  color: var(--juno-s0);
}

.juno-alert--solid .juno-alert__icon,
.juno-alert--solid .juno-alert__title,
.juno-alert--solid .juno-alert__text,
.juno-alert--solid .juno-alert__close { color: var(--juno-s0); }

/* ════════════════════════════════════════════════════════════════════
 *  Component — Avatar  ·  user / entity portrait
 *  A round (or squared) portrait that holds an <img>, initials, or an
 *  icon fallback. Sizes ride one custom property; an optional role ring
 *  marks status (online, alert…). Zero JS. Pairs with a
 *  .juno-skeleton--circle placeholder while the image loads.
 *  Usage:
 *    <span class="juno-avatar"><img src="…" alt="Ada Lovelace" /></span>
 *    <span class="juno-avatar juno-avatar--lg">AL</span>
 *    <span class="juno-avatar juno-avatar--ring juno--nominal">
 *      <svg class="juno-icon"><use href="…#juno-i-user" /></svg>
 *    </span>
 * ════════════════════════════════════════════════════════════════════ */

.juno-avatar {
  --juno-avatar-size: var(--juno-space-32);

  display: inline-grid;
  place-content: center;
  flex-shrink: 0;
  inline-size: var(--juno-avatar-size);
  block-size: var(--juno-avatar-size);
  overflow: hidden;
  border-radius: 50%;
  background: var(--juno-control-surface);
  border: var(--juno-border-width-1) solid var(--juno-control-edge-strong);
  color: var(--juno-label);
  font-family: var(--juno-font-family-sans);

  /* initials scale with the avatar (~40% of its box) */
  font-size: calc(var(--juno-avatar-size) * 0.4);
  font-weight: var(--juno-font-weight-semibold);
  letter-spacing: var(--juno-font-tracking-tight);
  text-transform: uppercase;
  user-select: none;
}

/* the image fills the circle */
.juno-avatar img {
  inline-size: 100%;
  block-size: 100%;
  object-fit: cover;
}

/* a square / rounded-rect portrait instead of a circle */
.juno-avatar--square {
  border-radius: var(--juno-radius-4);
}

/* status ring — reads the role; pair with a label / title for meaning */
.juno-avatar--ring {
  border-color: var(--juno-role);
  box-shadow: 0 0 0 var(--juno-border-width-2) color-mix(in srgb, var(--juno-role) 30%, transparent);
}

/* sizes */
.juno-avatar--sm {
  --juno-avatar-size: var(--juno-space-24);
}

.juno-avatar--lg {
  --juno-avatar-size: var(--juno-space-40);
}

.juno-avatar--xl {
  --juno-avatar-size: var(--juno-space-56);
}

/* overlapping cluster — a row of avatars that tuck under each other */
.juno-avatar-group {
  display: inline-flex;
  align-items: center;
}

.juno-avatar-group .juno-avatar {
  border-color: var(--juno-s0);
  border-width: var(--juno-border-width-2);
}

.juno-avatar-group .juno-avatar + .juno-avatar {
  margin-inline-start: calc(var(--juno-avatar-size) * -0.3);
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Badge / status indicator
 *  Usage:  <span class="juno-badge juno--nominal">NOMINAL</span>
 *          <span class="juno-badge juno-badge--outline juno--caution">…</span>
 *  Color comes from --juno-role (set by an .juno--<role> class).
 * ════════════════════════════════════════════════════════════════════ */

.juno-badge {
  --juno-role: var(--juno-muted);

  display: inline-flex;
  align-items: center;
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-11);
  font-weight: var(--juno-font-weight-bold);
  letter-spacing: var(--juno-font-tracking-caps);
  text-transform: uppercase;
  padding: var(--juno-space-4) var(--juno-space-10);
  border-radius: var(--juno-radius-3);
  border: var(--juno-border-width-1) solid transparent;
  white-space: nowrap;

  /* filled (default) */
  background: var(--juno-role);
  color: var(--juno-s0);
}

.juno-badge--outline {
  background: transparent;
  color: var(--juno-role);
  border-color: var(--juno-role);
}

/* micro — data-UI atom below the badge scale: provenance/kind tags, model
   names, threshold values. Mono, outline-only, 10px floor (the type scale
   stops there on purpose). Role via juno--* as usual. */
.juno-badge--micro {
  font-family: var(--juno-font-family-mono);
  font-size: var(--juno-font-size-10);
  font-weight: var(--juno-font-weight-semibold);
  letter-spacing: var(--juno-font-tracking-normal);
  padding: var(--juno-space-2) var(--juno-space-4);
  border-radius: var(--juno-radius-2);
  background: transparent;
  color: var(--juno-role);
  border-color: color-mix(in srgb, var(--juno-role) 55%, transparent);
}

/* soft — low-fill chip: role text on a tinted wash + faint role border.
   Quieter than filled; ideal for in-table status (a phase/state per row). */
.juno-badge--soft {
  background: color-mix(in srgb, var(--juno-role) 13%, transparent);
  color: var(--juno-role);
  border-color: color-mix(in srgb, var(--juno-role) 30%, transparent);
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Breadcrumb  ·  hierarchy trail
 *  A horizontal path of links to ancestor pages, ending at the current
 *  page. Built on a real <nav><ol>; the separator is a CSS chevron (no
 *  glyph font). Mark the last crumb aria-current="page". Zero JS.
 *  Usage:
 *    <nav class="juno-breadcrumb" aria-label="Breadcrumb">
 *      <ol>
 *        <li><a href="/">Home</a></li>
 *        <li><a href="/fleet">Fleet</a></li>
 *        <li><a aria-current="page">api-gateway</a></li>
 *      </ol>
 *    </nav>
 * ════════════════════════════════════════════════════════════════════ */

.juno-breadcrumb ol {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--juno-space-8);
  margin: 0;
  padding: 0;
  list-style: none;
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-13);
}

.juno-breadcrumb li {
  display: inline-flex;
  align-items: center;
  gap: var(--juno-space-8);
}

.juno-breadcrumb a {
  color: var(--juno-label);
  text-decoration: none;
  border-radius: var(--juno-radius-2);
}

.juno-breadcrumb a[href]:hover {
  color: var(--juno-data);
  text-decoration: underline;
}

.juno-breadcrumb a:focus-visible {
  outline: var(--juno-border-width-2) solid var(--juno-active);
  outline-offset: var(--juno-space-2);
}

/* current page — not a link; brightest */
.juno-breadcrumb [aria-current='page'] {
  color: var(--juno-data);
  font-weight: var(--juno-font-weight-semibold);
}

/* separator — a CSS chevron between items (no glyph font) */
.juno-breadcrumb li + li::before {
  content: '';
  inline-size: var(--juno-space-4);
  block-size: var(--juno-space-4);
  border-block-start: var(--juno-border-width-1) solid var(--juno-muted);
  border-inline-end: var(--juno-border-width-1) solid var(--juno-muted);
  transform: rotate(45deg); /* points to the inline-end (flips under RTL via dir) */
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Button
 *  Usage:  <button class="juno-btn juno--nominal">CONFIRM</button>
 *          <button class="juno-btn juno-btn--ghost">CANCEL</button>
 *          <button class="juno-btn juno-btn--sm">EDIT</button>
 * ════════════════════════════════════════════════════════════════════ */

.juno-btn {
  --juno-role: var(--juno-active);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--juno-gap-control);
  min-height: var(--juno-size-tap-min);
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-13);
  font-weight: var(--juno-font-weight-bold);
  letter-spacing: var(--juno-font-tracking-caps);
  text-transform: uppercase;
  padding: var(--juno-pad-control-block) var(--juno-pad-control-inline);
  border: var(--juno-border-width-1) solid transparent;
  border-radius: var(--juno-radius-4);
  cursor: pointer;

  /* primary (filled) */
  background: var(--juno-role);
  color: var(--juno-s0);
}

.juno-btn:hover { filter: brightness(1.08); }
.juno-btn:active { filter: brightness(0.94); }

.juno-btn--ghost {
  background: transparent;
  color: var(--juno-data);
  border-color: var(--juno-border);
  font-weight: var(--juno-font-weight-semibold);
}
.juno-btn--ghost:hover { background: var(--juno-s2); filter: none; }

/* Small — for dense desktop toolbars (40–46px bars) where the default
   control would not fit. Deliberately under the WCAG tap-min target:
   keep the default size for touch surfaces. Combines with --ghost + roles. */
.juno-btn--sm {
  min-height: var(--juno-space-24);
  font-size: var(--juno-font-size-11);
  letter-spacing: var(--juno-font-tracking-wide);
  padding: var(--juno-space-4) var(--juno-space-10);
  border-radius: var(--juno-radius-3);
}

.juno-btn:disabled {
  background: var(--juno-muted);
  color: var(--juno-label);
  border-color: transparent;
  cursor: not-allowed;
  filter: none;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Card / panel
 *  Usage:
 *    <article class="juno-card">
 *      <header class="juno-card__head">…<span class="juno-badge …">…</span></header>
 *      <div class="juno-card__body">…</div>
 *    </article>
 *  Add a status accent edge: <article class="juno-card juno-card--accent juno--caution">
 *  Critical full-border:     <article class="juno-card juno-card--alert  juno--warning">
 * ════════════════════════════════════════════════════════════════════ */

.juno-card {
  --juno-role: var(--juno-active);

  background: var(--juno-s1);
  border: var(--juno-border-width-1) solid var(--juno-border);
  border-radius: var(--juno-radius-8);
  overflow: hidden;
  container-type: inline-size; /* rows below adapt to the card's own width */
}

/* When the card itself is narrow, stack label/value rows. Driven by the
   card's container width, not the viewport — works in any layout. */
@container (max-width: 320px) {
  .juno-card__row {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--juno-space-2);
  }
}

.juno-card--accent { border-top: var(--juno-border-width-2) solid var(--juno-role); }

.juno-card--alert { border-color: var(--juno-role); border-top-width: var(--juno-border-width-2); }

.juno-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--juno-space-8);
  padding: var(--juno-space-12) var(--juno-space-16);
  border-bottom: var(--juno-border-width-1) solid var(--juno-border);
  font-size: var(--juno-font-size-12);
  font-weight: var(--juno-font-weight-semibold);
  letter-spacing: var(--juno-font-tracking-wide);
  text-transform: uppercase;
  color: var(--juno-data);
}

.juno-card--alert .juno-card__head {
  background: var(--juno-s2);
  border-bottom-color: var(--juno-role);
  color: var(--juno-role);
}

.juno-card__body {
  display: flex;
  flex-direction: column;
  gap: var(--juno-space-12);
  padding: var(--juno-pad-surface-block) var(--juno-pad-surface-inline);
}

/* Label / value row inside a card body */
.juno-card__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Checkbox & Radio
 *  Custom-styled native inputs (appearance:none) — keyboard + screen-reader
 *  native, zero JS. Checkbox is a targeting-reticle square whose solid core
 *  drops in on check; radio is a ring with a center dot. Default tint ACTIVE.
 *  Wrap with .juno-choice for an inline label row.
 *  Usage:
 *    <label class="juno-choice">
 *      <input class="juno-checkbox" type="checkbox" checked /> TCAS
 *    </label>
 *    <label class="juno-choice">
 *      <input class="juno-radio" type="radio" name="mode" /> MANAGED
 *    </label>
 * ════════════════════════════════════════════════════════════════════ */

.juno-choice {
  display: inline-flex;
  align-items: center;
  gap: var(--juno-gap-control);
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-13);
  color: var(--juno-data);
  cursor: pointer;
}

.juno-checkbox,
.juno-radio {
  --juno-role: var(--juno-active);

  appearance: none;
  margin: 0;
  flex-shrink: 0;
  inline-size: var(--juno-space-16);
  block-size: var(--juno-space-16);
  display: inline-grid;
  place-content: center;
  background: var(--juno-control-surface);
  border: var(--juno-border-width-1) solid var(--juno-control-edge-strong);
  cursor: pointer;
  transition:
    border-color var(--juno-motion-duration-quick) var(--juno-motion-ease-standard),
    box-shadow var(--juno-motion-duration-quick) var(--juno-motion-ease-standard);
}

.juno-checkbox { border-radius: var(--juno-radius-2); }
.juno-radio { border-radius: 50%; }

/* the core / dot — drops in on check with a slight overshoot */
.juno-checkbox::before,
.juno-radio::before {
  content: '';
  inline-size: var(--juno-space-8);
  block-size: var(--juno-space-8);
  background: var(--juno-role);
  transform: scale(0);
  transition: transform var(--juno-motion-duration-quick) var(--juno-motion-ease-spring);
}

.juno-checkbox::before { border-radius: 1px; }
.juno-radio::before { border-radius: 50%; }

.juno-checkbox:checked,
.juno-radio:checked {
  border-color: var(--juno-role);
  box-shadow: 0 0 0 var(--juno-border-width-3) color-mix(in srgb, var(--juno-role) 22%, transparent);
}

.juno-checkbox:checked::before,
.juno-radio:checked::before { transform: scale(1); }

/* indeterminate (e.g. a "select all" with a partial set) — a dash, not a core */
.juno-checkbox:indeterminate {
  border-color: var(--juno-role);
  box-shadow: 0 0 0 var(--juno-border-width-3) color-mix(in srgb, var(--juno-role) 22%, transparent);
}

.juno-checkbox:indeterminate::before {
  transform: scale(1);
  block-size: 2px;
}

.juno-checkbox:disabled,
.juno-radio:disabled {
  background: var(--juno-s1);
  opacity: var(--juno-opacity-disabled);
  cursor: not-allowed;
}

.juno-choice:has(:disabled) { color: var(--juno-muted); cursor: not-allowed; }

/* ════════════════════════════════════════════════════════════════════
 *  Component — Chip / Tag  ·  compact interactive token
 *  A pill that represents a discrete entity: a filter, a selected value,
 *  a removable tag. Unlike a badge (a static status label), a chip is
 *  interactive — selectable and/or dismissible. Reads --juno-role for its
 *  accent. Use a <button> for a toggle chip; add a remove button for a
 *  dismissible one. Zero JS — the app owns selection / removal.
 *  Usage:
 *    <span class="juno-chip">us-east-1</span>
 *    <button class="juno-chip juno-chip--toggle" aria-pressed="true">Active</button>
 *    <span class="juno-chip juno--active">
 *      filter:prod
 *      <button class="juno-chip__remove" aria-label="Remove">
 *        <svg class="juno-icon juno-icon--sm"><use href="…#juno-i-x" /></svg>
 *      </button>
 *    </span>
 * ════════════════════════════════════════════════════════════════════ */

.juno-chip {
  --juno-role: var(--juno-label);

  display: inline-flex;
  align-items: center;
  gap: var(--juno-space-8);
  block-size: var(--juno-space-24);
  padding-inline: var(--juno-space-12);
  border: var(--juno-border-width-1) solid var(--juno-control-edge-strong);
  border-radius: 999px;
  background: var(--juno-control-surface);
  color: var(--juno-data);
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-12);
  letter-spacing: var(--juno-font-tracking-tight);
  white-space: nowrap;
}

/* leading accent dot — reads the role; appears when a role class is set */
.juno-chip.juno--nominal,
.juno-chip.juno--active,
.juno-chip.juno--target,
.juno-chip.juno--caution,
.juno-chip.juno--warning {
  border-color: var(--juno-role);
  color: var(--juno-role);
  background: color-mix(in srgb, var(--juno-role) 12%, var(--juno-control-surface));
}

/* toggle chip — a real <button>; pressed = filled accent */
button.juno-chip {
  cursor: pointer;
  transition:
    border-color var(--juno-motion-duration-quick) var(--juno-motion-ease-standard),
    background-color var(--juno-motion-duration-quick) var(--juno-motion-ease-standard);
}

.juno-chip--toggle[aria-pressed='true'] {
  border-color: var(--juno-role);
  background: color-mix(in srgb, var(--juno-role) 18%, var(--juno-control-surface));
  color: var(--juno-role);
}

.juno-chip:focus-visible {
  outline: var(--juno-border-width-2) solid var(--juno-active);
  outline-offset: var(--juno-space-2);
}

/* remove affordance — a tiny inset button at the trailing edge */
.juno-chip__remove {
  display: inline-grid;
  place-content: center;
  margin-inline-end: calc(var(--juno-space-4) * -1);
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  opacity: var(--juno-opacity-muted);
  cursor: pointer;
}

.juno-chip__remove:hover,
.juno-chip__remove:focus-visible {
  opacity: 1;
}

.juno-chip:disabled,
.juno-chip[aria-disabled='true'] {
  opacity: var(--juno-opacity-disabled);
  cursor: not-allowed;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Divider  ·  visual / semantic separation
 *  A hairline rule. Horizontal by default; add --vertical for a column
 *  separator (stretches to the row's cross size). An optional centered
 *  label breaks the rule in two ("OR", "MORE"). Use a real <hr> for a
 *  semantic break, or a styled element when it's purely visual.
 *  Usage:
 *    <hr class="juno-divider" />
 *    <div class="juno-divider juno-divider--label">OR</div>
 *    <span class="juno-divider juno-divider--vertical"></span>
 * ════════════════════════════════════════════════════════════════════ */

.juno-divider {
  border: 0;
  margin: 0;
  block-size: var(--juno-border-width-1);
  inline-size: 100%;
  background: var(--juno-border);
}

/* vertical rule — sits inline; relies on the parent giving it block size */
.juno-divider--vertical {
  inline-size: var(--juno-border-width-1);
  block-size: auto;
  align-self: stretch;
  min-block-size: var(--juno-space-16);
}

/* labeled rule — a centered caption with a line on each side */
.juno-divider--label {
  display: flex;
  align-items: center;
  gap: var(--juno-space-12);
  border: 0;
  background: none;
  block-size: auto;
  color: var(--juno-label);
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-11);
  letter-spacing: var(--juno-font-tracking-label);
  text-transform: uppercase;
}

.juno-divider--label::before,
.juno-divider--label::after {
  content: '';
  flex: 1;
  block-size: var(--juno-border-width-1);
  background: var(--juno-border);
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Dock (app-shell bottom navigation)
 *  The narrow-viewport counterpart of the rail: 3–5 primary destinations
 *  as icon-over-label tap targets pinned to the bottom edge. Zero JS —
 *  the app sets aria-current="page"; the active item styles off the
 *  attribute, exactly like the rail.
 *
 *  Sticky (not fixed) so it stays in flow: put it last inside the
 *  scrolling column and it pins itself without overlapping content.
 *  Pads for the home-indicator via safe-area-inset. Pair with the rail
 *  using the viewport helpers (see docs/layout.md#app-shell):
 *    <nav class="juno-rail juno-hide-below-md" …>
 *    <nav class="juno-dock juno-hide-from-md" aria-label="Primary">
 *      <a class="juno-dock__item" href="…" aria-current="page">
 *        <svg class="juno-icon" aria-hidden="true"><use href="…#juno-i-squares-four" /></svg>
 *        <span class="juno-dock__label">Library</span>
 *      </a>
 *    </nav>
 * ════════════════════════════════════════════════════════════════════ */

.juno-dock {
  --juno-role: var(--juno-active);

  /* Consumer-driven shrink (e.g. dim/compact the bar on scroll) — default 1,
     a no-op. Applies to the whole bar regardless of variant (plain/--fixed/
     --pill/--float/--icon). Transition duration is authored through the
     motion scale (see base.css's JS-readable --juno-motion contract) so
     prefers-reduced-motion collapses it to 0 without a component-local
     media query. */
  --juno-dock-scale: 1;

  position: sticky;
  inset-block-end: 0;
  z-index: var(--juno-z-raised);
  display: flex;
  align-items: stretch;
  background: var(--juno-s1);
  border-block-start: var(--juno-border-width-1) solid var(--juno-border);
  padding-block-end: env(safe-area-inset-bottom, 0);
  transform: scale(var(--juno-dock-scale));
  transform-origin: bottom center;
  transition: transform calc(var(--juno-motion-duration-quick) * var(--juno-motion-scale)) var(--juno-motion-ease-standard);
}

.juno-dock__item {
  flex: 1 1 0;
  min-inline-size: 0;
  min-block-size: var(--juno-size-tap-comfortable);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--juno-space-2);
  padding-block: var(--juno-space-4);

  /* Full reset, not just the top edge: a plain `border-block-start` override
     leaves the UA default border on the other three sides of a <button>
     item (links have none, so this went unnoticed until <button> showed up
     in the pill variant's usage). Re-add only the edge that carries the
     active accent. */
  border: none;
  border-block-start: var(--juno-border-width-2) solid transparent;
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-10);
  font-weight: var(--juno-font-weight-semibold);
  letter-spacing: var(--juno-font-tracking-label);
  text-transform: uppercase;
  text-decoration: none;
  color: var(--juno-label);
  cursor: pointer;
}

.juno-dock__label {
  max-inline-size: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.juno-dock__item:hover { color: var(--juno-data); }

/* active = attribute, not class: <a aria-current="page"> */
.juno-dock__item[aria-current] {
  border-block-start-color: var(--juno-role);
  background: var(--juno-s2);
  color: var(--juno-data);
}

.juno-dock__item:focus-visible {
  outline: var(--juno-border-width-2) solid var(--juno-active);
  outline-offset: calc(-1 * var(--juno-space-2));
}

/* Fixed — same story as the pillbar: sticky only pins while the column
   overflows, so on a short page the dock lands mid-content. Pin to the
   viewport foot in a page-scroll shell where content height varies. Since
   fixed leaves the flow, reserve its height at the page foot (e.g.
   padding-block-end) so it doesn't cover the last row. In-flow
   .juno-app-shell (main is the scroller, dock at the body foot) needs none
   of this — prefer it. */
.juno-dock--fixed {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
}

/* ── Pill variant — the full-width bar becomes a rounded floating pill with
   big glyphs in circular bubbles. Labels drop; each icon sits in a circular
   .juno-dock__bubble that fills only on the active tab (not the whole item).
   Out of flow (fixed) so the page scrolls UNDER it — reserve room on the
   scroller with padding-block-end: var(--juno-dock-clearance).
   Usage — pair the bubble with .juno-icon-loader, junoui's concentric-stack
   primitive, so a loading arc can be dropped in without re-rolling geometry:
     <nav class="juno-dock juno-dock--pill juno-hide-from-md" aria-label="Primary">
       <a class="juno-dock__item" href="…" aria-current="page" aria-label="Library">
         <span class="juno-dock__bubble juno-icon-loader">
           <svg class="juno-icon" aria-hidden="true"><use href="…#juno-i-squares-four" /></svg>
         </span>
       </a>
     </nav>
   Labels are hidden, so every item MUST carry an aria-label (on the <a>/<button>)
   — the glyph alone is not an accessible name. */
.juno-dock--pill {
  --juno-role: var(--juno-active);

  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: var(--juno-z-raised);
  margin: 0 var(--juno-space-12) var(--juno-dock-edge-offset);
  padding: var(--juno-space-4);
  background: color-mix(in srgb, var(--juno-s1) 88%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: var(--juno-border-width-1) solid var(--juno-border);
  border-radius: 999px;
  box-shadow: var(--juno-shadow-2);
}

.juno-dock--pill .juno-dock__item {
  min-block-size: 0;
  gap: 0;
  padding-block: var(--juno-space-4);

  /* full reset: the base only zeroes the block-start border, but the pill has
     no top edge to accent — the active state moves to the bubble. Also kill the
     UA tap-highlight so no square flashes past the round bubble on tap. */
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
}

.juno-dock--pill .juno-dock__label { display: none; }

/* Focus lands on the bubble so the ring hugs the round target, not the wide
   item box. */
.juno-dock--pill .juno-dock__item:focus-visible { outline: none; }

.juno-dock--pill .juno-dock__item:focus-visible .juno-dock__bubble {
  outline: var(--juno-border-width-2) solid var(--juno-active);
  outline-offset: var(--juno-space-2);
}

/* The bubble is a definite-size circular surface that centres its glyph. It
   declares the same single-cell grid as .juno-icon-loader so composing the
   two (see the usage block above) can't fight over `display`, and so the
   ring — when one is present — is concentric with the glyph. */
.juno-dock__bubble {
  /* Section-loading ring — with .juno-icon-loader on the same element, an
     indeterminate .juno-arc dropped inside rings the bubble's EDGE (diameter
     = the bubble, thin stroke) instead of the glyph. Because the bubble's box
     is definite, adding or removing the arc never resizes it. */
  --juno-icon-loader-ring: var(--juno-size-tap-comfortable);
  --juno-icon-loader-ring-width: 2px;

  display: grid;
  place-items: center;
  inline-size: var(--juno-size-tap-comfortable);
  block-size: var(--juno-size-tap-comfortable);
  border-radius: 50%;
  transition: background-color var(--juno-motion-duration-quick) var(--juno-motion-ease-standard);
}

/* Explicit big glyph so the pill reads at a glance. Set on the glyph itself so
   it wins regardless of context (the base .juno-icon no longer pins a size —
   see 20260727-011). */
.juno-dock--pill .juno-icon { --juno-icon-size: var(--juno-space-32); }

/* Active reads on the bubble alone — suppress the base full-item fill so only
   the circular highlight shows. */
.juno-dock--pill .juno-dock__item[aria-current] {
  background: none;
  color: var(--juno-role);
}

.juno-dock--pill .juno-dock__item[aria-current] .juno-dock__bubble {
  background: var(--juno-s3);
}

/* reduced-transparency → solid surface, no blur (matches the pillbar) */
@media (prefers-reduced-transparency: reduce) {
  .juno-dock--pill {
    background: var(--juno-s1);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* ── Float variant — the pillbar's floating capsule chrome (fixed, rounded
   shell, blur, shadow, off-edge margin) applied to the dock's OWN item model:
   unlike --pill it keeps icon+label items and the full-item active fill —
   only the exterior changes. Combine with --icon below for the bubble
   treatment inside a capsule (the old --pill look, decomposed). `border`
   fully replaces the base's `border-block-start` (no top seam on a capsule),
   and `padding` fully replaces the base's safe-area padding (the margin
   below carries the safe area instead — additive offset off the edge, not
   `max()`: see docs/ios-conformance.md). `overflow: hidden` clips the
   items' square corners to the capsule's rounded shape.
   Usage:
     <nav class="juno-dock juno-dock--float juno-hide-from-md" aria-label="Primary">
       <a class="juno-dock__item" href="…" aria-current="page">
         <svg class="juno-icon" aria-hidden="true"><use href="…#juno-i-squares-four" /></svg>
         <span class="juno-dock__label">Library</span>
       </a>
     </nav>
   Out of flow (fixed) so the page scrolls UNDER it — reserve room on the
   scroller with padding-block-end: var(--juno-dock-clearance). */
.juno-dock--float {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: var(--juno-z-raised);
  margin: 0 var(--juno-space-12) var(--juno-dock-edge-offset);
  padding: var(--juno-space-4);
  overflow: hidden;
  background: color-mix(in srgb, var(--juno-s1) 88%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: var(--juno-border-width-1) solid var(--juno-border);
  border-radius: 999px;
  box-shadow: var(--juno-shadow-2);
}

/* reduced-transparency → solid surface, no blur (matches the pillbar / --pill) */
@media (prefers-reduced-transparency: reduce) {
  .juno-dock--float {
    background: var(--juno-s1);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* ── Icon variant — labels drop, glyphs grow, and the active state moves to
   a circular .juno-dock__bubble instead of filling the whole item, WITHOUT
   forcing the floating capsule chrome (that's --float, above — combine both
   for the old --pill look). Usable standalone on a plain sticky/--fixed bar
   for a compact, icon-only full-width dock.
   Usage — same .juno-dock__bubble contract as --pill (pair with
   .juno-icon-loader; see docs/components/dock.md#pill-variant):
     <nav class="juno-dock juno-dock--icon juno-hide-from-md" aria-label="Primary">
       <a class="juno-dock__item" href="…" aria-current="page" aria-label="Library">
         <span class="juno-dock__bubble juno-icon-loader">
           <svg class="juno-icon" aria-hidden="true"><use href="…#juno-i-squares-four" /></svg>
         </span>
       </a>
     </nav>
   Labels are hidden, so every item MUST carry an aria-label — the glyph
   alone is not an accessible name. */
.juno-dock--icon .juno-dock__item {
  gap: 0;

  /* accent moves to the bubble; kill the item-edge border in both states */
  border-color: transparent;
}

.juno-dock--icon .juno-dock__label { display: none; }

/* Explicit big glyph so the icon-only bar reads at a glance — set on the
   glyph itself so it wins regardless of context (the base .juno-icon no
   longer pins a size — see 20260727-011). */
.juno-dock--icon .juno-icon { --juno-icon-size: var(--juno-space-32); }

/* Focus lands on the bubble so the ring hugs the round target, not the wide
   item box. */
.juno-dock--icon .juno-dock__item:focus-visible { outline: none; }

.juno-dock--icon .juno-dock__item:focus-visible .juno-dock__bubble {
  outline: var(--juno-border-width-2) solid var(--juno-active);
  outline-offset: var(--juno-space-2);
}

/* Active reads on the bubble alone — suppress the base full-item fill so
   only the circular highlight shows. */
.juno-dock--icon .juno-dock__item[aria-current] {
  background: none;
  color: var(--juno-role);
}

.juno-dock--icon .juno-dock__item[aria-current] .juno-dock__bubble {
  background: var(--juno-s3);
}

/* ── Collapsible variant — the whole bar folds into a single circular
   .juno-dock__knob at the inline-end edge, and unfolds back to full width.
   Driven by ONE inherited custom prop the app writes (junoui ships no JS):
   --juno-dock-fold, 0 = fully open … 1 = the circle. Write it per scroll
   frame for a gesture-tracked fold (set it on the dock, an ancestor, or
   :root — it is only CONSUMED here, never declared, so an inherited value
   always lands), or flip it 0/1 for a plain toggle.

   The fold has two phases, split at --juno-dock-fold-split: first the bar
   SHRINKS in place to --juno-dock-fold-scale (transform, no relayout),
   then it SLIDES shut to --juno-dock-collapsed-size. Width interpolates
   between two definite lengths because a transition cannot run to or from
   an intrinsic size; --juno-dock-fold-smoothing is smoothing over
   scroll-event discretization, not the fold itself — anything longer lags
   the finger driving it.

   Compose with a fixed placement (--pill, --float, or --fixed): the fold
   re-anchors the bar to the inline-end edge, which only means something
   out of flow. Transform-origin is the physical bottom right — the fold's
   own scale REPLACES the base --juno-dock-scale hook (one transform slot);
   RTL consumers flip the origin and inset overrides together.

   Structure — items live in a tray; the knob is the circle's face:
     <nav class="juno-dock juno-dock--pill juno-dock--collapsible …"
          data-juno-collapsed>
       <div class="juno-dock__tray"> …the usual __item children… </div>
       <button class="juno-dock__knob" aria-label="Show navigation">
         <svg class="juno-icon" aria-hidden="true"><use href="…#juno-i-dots-three" /></svg>
       </button>
     </nav>

   data-juno-collapsed is the END state, set by the app only at fold = 1
   (and removed the moment the fold reopens): it flips the tray to
   visibility:hidden — which removes its items from the tab order — and
   reveals the knob. Mid-fold both stay live; the tray's opacity empties
   ahead of the slide (×1.6) so the glyphs are gone before the circle
   closes. The knob MUST carry an aria-label; collapsing while focus is
   inside the tray is the app's edge — move focus to the knob first.
   prefers-reduced-motion needs nothing component-local: the base layer
   zeroes every transition, and the fold value itself is app-driven. */
.juno-dock--collapsible {
  --juno-dock-fold-split: 0.35;
  --juno-dock-fold-scale: 0.78;
  --juno-dock-collapsed-size: calc(
    var(--juno-size-tap-comfortable) + 2 * var(--juno-space-4) + 2 * var(--juno-border-width-1)
  );
  --juno-dock-edge-gap: calc(2 * var(--juno-space-12));
  --juno-dock-fold-smoothing: 90ms;

  /* per-phase normalized progress, derived — never set these directly */
  --juno-dock-fold-shrink: min(1, var(--juno-dock-fold, 0) / var(--juno-dock-fold-split));
  --juno-dock-fold-slide: clamp(
    0,
    (var(--juno-dock-fold, 0) - var(--juno-dock-fold-split)) / (1 - var(--juno-dock-fold-split)),
    1
  );

  inset-inline-start: auto;
  inline-size: calc(
    var(--juno-dock-collapsed-size) +
      (100% - var(--juno-dock-edge-gap) - var(--juno-dock-collapsed-size)) *
      (1 - var(--juno-dock-fold-slide))
  );
  overflow: hidden;
  transform: scale(calc(1 - (1 - var(--juno-dock-fold-scale)) * var(--juno-dock-fold-shrink)));
  transform-origin: bottom right;
  transition:
    transform var(--juno-dock-fold-smoothing) linear,
    inline-size var(--juno-dock-fold-smoothing) linear;
}

.juno-dock__tray {
  flex: 1;
  min-inline-size: 0;
  display: flex;
  align-items: stretch;
  opacity: calc(1 - var(--juno-dock-fold-slide, 0) * 1.6);
  transition: opacity var(--juno-dock-fold-smoothing, 90ms) linear;
}

.juno-dock__knob {
  position: absolute;
  inset-block: 0;
  inset-inline-end: var(--juno-space-4);
  margin-block: auto;
  inline-size: var(--juno-size-tap-comfortable);
  block-size: var(--juno-size-tap-comfortable);
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: none;
  color: var(--juno-label);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--juno-motion-duration-quick) var(--juno-motion-ease-standard);
}

.juno-dock--collapsible[data-juno-collapsed] .juno-dock__tray { visibility: hidden; }

.juno-dock--collapsible[data-juno-collapsed] .juno-dock__knob {
  opacity: 1;
  visibility: visible;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Status dot + label
 *  Usage:
 *    <span class="juno-status juno--nominal">
 *      <span class="juno-status__dot"></span>NOMINAL
 *    </span>
 *  Pair color with the text label — color is never the sole signal.
 * ════════════════════════════════════════════════════════════════════ */

.juno-status {
  --juno-role: var(--juno-nominal);

  display: inline-flex;
  align-items: center;
  gap: var(--juno-space-8);
  font-size: var(--juno-font-size-12);
  letter-spacing: var(--juno-font-tracking-label);
  color: var(--juno-role);
}

.juno-status__dot {
  width: var(--juno-size-dot-sm);
  height: var(--juno-size-dot-sm);
  border-radius: 50%;
  background: var(--juno-role);
  flex-shrink: 0;
}

.juno-status--lg .juno-status__dot {
  width: var(--juno-size-dot-md);
  height: var(--juno-size-dot-md);
}

/* Live/armed pulse — respects prefers-reduced-motion via base layer. */
.juno-status--live .juno-status__dot { animation: juno-blink 1.4s ease-in-out infinite; }

/* ════════════════════════════════════════════════════════════════════
 *  Component — Drawer
 *  Edge-anchored <dialog> for secondary tasks and settings. Same scrim and
 *  layer as the modal, but slides along one axis. App owns showModal()/close().
 *  Default anchors to the inline-end edge; modifiers move it.
 *  Usage:
 *    <dialog class="juno-modal juno-drawer">…</dialog>            (inline-end)
 *    <dialog class="juno-modal juno-drawer juno-drawer--start">…</dialog>
 *    <dialog class="juno-modal juno-drawer juno-drawer--bottom">…</dialog>
 *  Reuses .juno-modal for the surface + scrim; this file re-pins + re-slides.
 *  Selectors are compound (.juno-modal.juno-drawer) so they override the
 *  modal's centered transform regardless of bundle order.
 *
 *  --bottom is a real bottom sheet: a grab handle (.juno-sheet__handle,
 *  decorative) plus a CSS height knob (--juno-sheet-h, default 60dvh —
 *  apps swap it for peek/half/full snap points, capped by --juno-sheet-max).
 *  No drag gesture ships here: resizing/dismissing by drag is stateful and
 *  stays in the app. See docs/components/drawer.md and 20260802-019.
 * ════════════════════════════════════════════════════════════════════ */

.juno-modal.juno-drawer {
  inline-size: 380px;
  max-inline-size: 100%;
  block-size: 100dvh;
  max-block-size: 100dvh;
  border-radius: 0;
  border: none;

  /* pin to the inline-end edge (mirrors under RTL) */
  margin-block: 0;
  margin-inline: auto 0;
  border-inline-start: var(--juno-border-width-1) solid var(--juno-border);

  /* slide in from the edge; base speed (lighter than a modal) */
  transform: translateX(100%);
  transition:
    transform var(--juno-motion-duration-base) var(--juno-motion-ease-decel),
    overlay var(--juno-motion-duration-base) allow-discrete,
    display var(--juno-motion-duration-base) allow-discrete;
}

.juno-modal.juno-drawer[open] { transform: translateX(0); }

@starting-style {
  .juno-modal.juno-drawer[open] { transform: translateX(100%); }
}

.juno-modal.juno-drawer--start {
  margin-inline: 0 auto;
  border-inline: none;
  border-inline-end: var(--juno-border-width-1) solid var(--juno-border);
  transform: translateX(-100%);
}

.juno-modal.juno-drawer--start[open] { transform: translateX(0); }

@starting-style {
  .juno-modal.juno-drawer--start[open] { transform: translateX(-100%); }
}

.juno-modal.juno-drawer--bottom {
  inline-size: 100%;
  max-inline-size: 100%;

  /* height knob: swap --juno-sheet-h for snap points (peek/half/full).
     --juno-sheet-max is the hard ceiling so a swapped value can't run past
     it. CSS-only — the drag gesture a real snap-point picker needs is
     stateful and stays in the app. */
  block-size: var(--juno-sheet-h, 60dvh);
  max-block-size: var(--juno-sheet-max, 92dvh);
  margin-block: auto 0;
  margin-inline: 0;
  border: none;
  border-block-start: var(--juno-border-width-1) solid var(--juno-border);
  border-start-start-radius: var(--juno-radius-8);
  border-start-end-radius: var(--juno-radius-8);
  transform: translateY(100%);

  /* safe area moves to .juno-modal__body below (the scroll port) — padding
     here would just be dead space under the grab handle. See 20260802-019. */
  padding-block-end: 0;
}

.juno-modal.juno-drawer--bottom[open] { transform: translateY(0); }

@starting-style {
  .juno-modal.juno-drawer--bottom[open] { transform: translateY(100%); }
}

/* grab handle — visual affordance only. aria-hidden in markup: the dialog's
   own aria-labelledby (→ the title) stays the accessible name. Dragging it
   to resize/dismiss is stateful, so junoui draws it but never wires a
   gesture to it — see docs/accessibility.md. */
.juno-sheet__handle {
  inline-size: var(--juno-space-40);
  block-size: var(--juno-space-4);
  margin: var(--juno-space-8) auto;
  border-radius: 999px;
  background: var(--juno-border-strong);
}

/* the scrolling body owns the safe area now, mirroring modal.css's mobile
   sheet. Compound selector for specificity: drawer.css sorts before
   modal.css in the bundle (scripts/bundle-css.mjs), so a bare
   .juno-modal__body override here would lose to modal.css's own rule at
   equal specificity. env() fallback keeps its unit inside calc() — see
   docs/ios-conformance.md. */
.juno-modal.juno-drawer--bottom .juno-modal__body {
  padding-block-end: calc(var(--juno-pad-surface-inline) + 34px);
}

/* ── narrow viewports ────────────────────────────────────────────────────
   Side drawers cap below the full width so a sliver of scrim survives —
   the visual cue (and tap target) that "outside" closes the panel. */
@media (width <= 639.98px) {
  .juno-modal.juno-drawer:not(.juno-drawer--bottom) { inline-size: min(380px, 85vw); }
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Field
 *  Wraps any control with a label, optional help, and an error message.
 *  Usage:
 *    <div class="juno-field">
 *      <label class="juno-field__label" for="cs">Order ID
 *        <span class="juno-field__req" aria-hidden="true">*</span>
 *      </label>
 *      <input id="cs" class="juno-input juno-mono" type="text" />
 *      <span class="juno-field__help">Prefix + number</span>
 *    </div>
 *  Error: add aria-invalid="true" to the control and swap help → __error.
 * ════════════════════════════════════════════════════════════════════ */

.juno-field {
  display: flex;
  flex-direction: column;
  gap: var(--juno-space-4);
}

.juno-field__label {
  font-family: var(--juno-font-family-sans);
  font-size: var(--juno-font-size-10);
  letter-spacing: var(--juno-font-tracking-wider);
  text-transform: uppercase;
  color: var(--juno-label);
}

/* required marker — warning hue, paired with aria-required on the control */
.juno-field__req {
  color: var(--juno-warning);
  margin-inline-start: var(--juno-space-2);
}

.juno-field__help { font-size: var(--juno-font-size-11); color: var(--juno-label); }

.juno-field__error { font-size: var(--juno-font-size-11); color: var(--juno-warning); }

/* ════════════════════════════════════════════════════════════════════
 *  Component — Fold slot (animated presence for a row member)
 *  A slot inside any flex/grid row that animates between PRESENT and
 *  FOLDED-AWAY instead of popping in and out of the DOM: its inline-size
 *  folds to zero, it fades, and at the end of the fold it leaves the
 *  tab order via visibility (discrete transition: instant coming in,
 *  end-of-fade going out). Keep the element mounted; drive the state
 *  with the data-juno-in attribute — zero JS here, the app owns when.
 *
 *  The size must be DEFINITE (--juno-fold-size) because a transition
 *  cannot run to or from an intrinsic width. If the row uses a flex/grid
 *  gap, the folded slot still occupies one gap — name it in
 *  --juno-fold-gap and the fold swallows it with a negative margin.
 *
 *  Canonical use: a transient action in a toolbar/pill row (a
 *  scroll-to-top arrow, a contextual button) whose arrival should slide
 *  the row open rather than jump it.
 *  Usage:
 *    <div style="display:flex; gap:4px">                  (any row)
 *      <button class="juno-fold" data-juno-in aria-label="Scroll to top">…</button>
 *      …other members…
 *    </div>
 *  prefers-reduced-motion needs nothing component-local — the base
 *  layer zeroes every transition duration. */
.juno-fold {
  --juno-fold-size: var(--juno-size-tap-comfortable);
  --juno-fold-gap: 0px;

  flex-shrink: 0;
  inline-size: var(--juno-fold-size);
  overflow: hidden;
  transition:
    inline-size var(--juno-motion-duration-base) var(--juno-motion-ease-standard),
    margin var(--juno-motion-duration-base) var(--juno-motion-ease-standard),
    opacity var(--juno-motion-duration-base) var(--juno-motion-ease-standard),
    visibility var(--juno-motion-duration-base) var(--juno-motion-ease-standard);
}

.juno-fold:not([data-juno-in]) {
  inline-size: 0;
  margin-inline-end: calc(-1 * var(--juno-fold-gap));
  opacity: 0;
  visibility: hidden;
}

/* ════════════════════════════════════════════════════════════════════
 *  Component — Gauge (determinate metric ring)
 *  A fixed-value ring for readouts (CPU / RAM / DISK …) — the metric
 *  cousin of the arc loader. Set --juno-gauge-value (0–100) inline or
 *  from JS; color comes from --juno-role. junoui ships no threshold
 *  policy: the app maps value → role class (see gauge.md for the
 *  75/90 recipe).
 *  Usage:
 *    <div class="juno-gauge juno--nominal" style="--juno-gauge-value: 67">
 *      <span class="juno-gauge__value">67</span>
 *    </div>
 *    <span class="juno-gauge__label">DISK</span>
 * ════════════════════════════════════════════════════════════════════ */

/* registered so the sweep can transition when the value changes */
@property --juno-gauge-value {
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}

.juno-gauge {
  --juno-role: var(--juno-active);
  --juno-gauge-size: 64px;
  --juno-gauge-width: 4px;

  position: relative;
  display: inline-flex;
  align-items: center;
